  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

  &lt;style&gt;

  &lt;/style&gt;

  &lt;div class=&quot;ccc-topline&quot;&gt;

      &lt;select id=&quot;ccc-metric&quot; class=&quot;form-select&quot;&gt;
        &lt;option value=&quot;allin&quot; selected&gt;All-in $ / success&lt;/option&gt;
        &lt;option value=&quot;cash&quot;&gt;Cash $ / success&lt;/option&gt;

      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label ccc-slider&quot; for=&quot;ccc-power&quot;&gt;China power-price discount · &lt;output id=&quot;ccc-power-out&quot; class=&quot;ccc-output&quot;&gt;35%&lt;/output&gt;
      &lt;input id=&quot;ccc-power&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;60&quot; step=&quot;5&quot; value=&quot;35&quot;&gt;

      &lt;input id=&quot;ccc-hardware&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;65&quot; step=&quot;5&quot; value=&quot;30&quot;&gt;

      &lt;div class=&quot;text-small&quot; id=&quot;ccc-gap-context&quot;&gt;—&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot; id=&quot;ccc-parity-label&quot;&gt;China parity condition&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot; id=&quot;ccc-parity-value&quot;&gt;—&lt;/div&gt;
      &lt;div class=&quot;text-small&quot; id=&quot;ccc-parity-context&quot;&gt;—&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ccc-chart-wrap&quot;&gt;
    &lt;svg id=&quot;ccc-chart&quot; class=&quot;ccc-chart&quot; viewBox=&quot;0 0 736 390&quot; role=&quot;img&quot; aria-labelledby=&quot;ccc-svg-title ccc-svg-desc&quot;&gt;
      &lt;title id=&quot;ccc-svg-title&quot;&gt;Illustrative global compute cost curve&lt;/title&gt;
      &lt;desc id=&quot;ccc-svg-desc&quot;&gt;Stacks are ranked from lowest to highest cost. Bar width represents annual successful-task capacity and bar height represents the selected cost or resource intensity.&lt;/desc&gt;
    &lt;/svg&gt;
  &lt;/div&gt;

  &lt;div id=&quot;ccc-lowest&quot; class=&quot;ccc-lowest text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;ccc-legend text-small&quot; aria-label=&quot;Country legend&quot;&gt;
    &lt;span class=&quot;ccc-legend-item&quot;&gt;&lt;span class=&quot;ccc-swatch ccc-china&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;China&lt;/span&gt;
    &lt;span class=&quot;ccc-legend-item&quot;&gt;&lt;span class=&quot;ccc-swatch ccc-us&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;United States&lt;/span&gt;
    &lt;span class=&quot;ccc-legend-item&quot;&gt;&lt;span class=&quot;ccc-swatch ccc-row&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;Rest of world&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ccc-note text-small text-muted&quot;&gt;Synthetic values demonstrate the intended interaction and layout; no ranking shown here is a research result.&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;compute-cost-curve-viz&#x27;);
      if (!root) return;

      const stacks = [
        { name: &#x27;Inner Mongolia · Ascend&#x27;, short: [&#x27;Inner&#x27;, &#x27;Mongolia&#x27;], country: &#x27;China&#x27;, capacity: 38, fixed: 0.48, other: 0.08, kwh: 3.40, price: 0.070, carbon: 0.58, util: 0.55 },
        { name: &#x27;Guizhou · Ascend&#x27;, short: [&#x27;Guizhou&#x27;, &#x27;Ascend&#x27;], country: &#x27;China&#x27;, capacity: 26, fixed: 0.52, other: 0.09, kwh: 3.10, price: 0.080, carbon: 0.42, util: 0.55 },
        { name: &#x27;Shanghai · mixed fleet&#x27;, short: [&#x27;Shanghai&#x27;, &#x27;mixed&#x27;], country: &#x27;China&#x27;, capacity: 22, fixed: 0.60, other: 0.11, kwh: 3.00, price: 0.100, carbon: 0.49, util: 0.55 },
        { name: &#x27;Texas · B-series&#x27;, short: [&#x27;Texas&#x27;, &#x27;B-series&#x27;], country: &#x27;US&#x27;, capacity: 34, fixed: 0.42, other: 0.08, kwh: 1.80, price: 0.075, carbon: 0.39, util: 0.75 },
        { name: &#x27;Virginia · H-series&#x27;, short: [&#x27;Virginia&#x27;, &#x27;H-series&#x27;], country: &#x27;US&#x27;, capacity: 30, fixed: 0.55, other: 0.10, kwh: 2.10, price: 0.088, carbon: 0.34, util: 0.75 },
        { name: &#x27;Gulf · B-series&#x27;, short: [&#x27;Gulf&#x27;, &#x27;B-series&#x27;], country: &#x27;RoW&#x27;, capacity: 28, fixed: 0.46, other: 0.09, kwh: 2.00, price: 0.055, carbon: 0.47, util: 0.70 },
        { name: &#x27;Nordics · H-series&#x27;, short: [&#x27;Nordics&#x27;, &#x27;H-series&#x27;], country: &#x27;RoW&#x27;, capacity: 18, fixed: 0.51, other: 0.09, kwh: 1.65, price: 0.070, carbon: 0.08, util: 0.70 }
      ];

      const workloads = {
        bulk: { factor: 0.46, label: &#x27;bulk extraction&#x27; },
        coding: { factor: 1.00, label: &#x27;reasoning &amp; coding&#x27; },
        agentic: { factor: 2.35, label: &#x27;agentic work&#x27; }
      };

      const colors = {
        China: &#x27;var(--viz-series-1)&#x27;,
        US: &#x27;var(--viz-series-2)&#x27;,
        RoW: &#x27;var(--viz-series-3)&#x27;
      };

      const metricMeta = {
        allin: { axis: &#x27;All-in USD / successful task&#x27;, short: &#x27;$ / success&#x27; },
        cash: { axis: &#x27;Cash USD / successful task&#x27;, short: &#x27;cash $ / success&#x27; },
        energy: { axis: &#x27;kWh / successful task&#x27;, short: &#x27;kWh / success&#x27; },
        carbon: { axis: &#x27;kg CO₂e / successful task&#x27;, short: &#x27;kg CO₂e / success&#x27; }
      };

      const els = {
        workload: root.querySelector(&#x27;#ccc-workload&#x27;),
        metric: root.querySelector(&#x27;#ccc-metric&#x27;),
        power: root.querySelector(&#x27;#ccc-power&#x27;),
        hardware: root.querySelector(&#x27;#ccc-hardware&#x27;),
        model: root.querySelector(&#x27;#ccc-model&#x27;),
        util: root.querySelector(&#x27;#ccc-util&#x27;),
        powerOut: root.querySelector(&#x27;#ccc-power-out&#x27;),
        hardwareOut: root.querySelector(&#x27;#ccc-hardware-out&#x27;),
        modelOut: root.querySelector(&#x27;#ccc-model-out&#x27;),
        utilOut: root.querySelector(&#x27;#ccc-util-out&#x27;),
        gapLabel: root.querySelector(&#x27;#ccc-gap-label&#x27;),
        gapValue: root.querySelector(&#x27;#ccc-gap-value&#x27;),
        gapContext: root.querySelector(&#x27;#ccc-gap-context&#x27;),
        parityLabel: root.querySelector(&#x27;#ccc-parity-label&#x27;),
        parityValue: root.querySelector(&#x27;#ccc-parity-value&#x27;),
        parityContext: root.querySelector(&#x27;#ccc-parity-context&#x27;),
        chart: root.querySelector(&#x27;#ccc-chart&#x27;),
        lowest: root.querySelector(&#x27;#ccc-lowest&#x27;),
        desc: root.querySelector(&#x27;#ccc-svg-desc&#x27;)
      };

      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;

      function svgEl(tag, attrs = {}, textValue = &#x27;&#x27;) {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; el.setAttribute(key, String(value)));
        if (textValue) el.textContent = textValue;
        return el;
      }

      function state() {
        return {
          workload: els.workload.value,
          metric: els.metric.value,
          powerDiscount: Number(els.power.value) / 100,
          hardwareGap: Number(els.hardware.value) / 100,
          modelAdvantage: Number(els.model.value) / 100,
          chinaUtil: Number(els.util.value) / 100
        };
      }

      function calculate(s, st, modelOverride) {
        const isChina = s.country === &#x27;China&#x27;;
        const workload = workloads[st.workload];
        const modelAdvantage = modelOverride === undefined ? st.modelAdvantage : modelOverride;
        const productivity = isChina
          ? Math.max(0.15, (1 - st.hardwareGap) / Math.max(0.20, 1 - modelAdvantage))
          : 1;
        const resourceFactor = workload.factor / productivity;
        const utilization = isChina ? st.chinaUtil : s.util;
        const effectivePrice = s.price * (isChina ? 1 - st.powerDiscount : 1);
        const kwh = s.kwh * resourceFactor;
        const cash = (kwh * effectivePrice) + (s.other * resourceFactor);
        const fixed = s.fixed * resourceFactor * (s.util / utilization);
        const values = {
          cash,
          allin: cash + fixed,
          energy: kwh,
          carbon: kwh * s.carbon
        };
        return {
          ...s,
          value: values[st.metric],
          capacityValue: s.capacity * (utilization / s.util) * productivity / workload.factor,
          cash,
          fixed,
          energy: kwh,
          carbonValue: kwh * s.carbon
        };
      }

      function weightedAverage(rows, country) {
        const subset = rows.filter((r) =&gt; r.country === country);
        const totalCapacity = subset.reduce((sum, r) =&gt; sum + r.capacityValue, 0);
        return subset.reduce((sum, r) =&gt; sum + r.value * r.capacityValue, 0) / totalCapacity;
      }

      function formatValue(value, metric) {
        if (metric === &#x27;allin&#x27; || metric === &#x27;cash&#x27;) return `$${value.toFixed(value &lt; 1 ? 2 : 1)}`;
        if (metric === &#x27;energy&#x27;) return `${value.toFixed(value &lt; 1 ? 2 : 1)} kWh`;
        return `${value.toFixed(value &lt; 1 ? 2 : 1)} kg`;
      }

      function niceMax(value) {
        if (value &lt;= 0) return 1;
        const magnitude = 10 ** Math.floor(Math.log10(value));
        const normalized = value / magnitude;
        const nice = normalized &lt;= 1.2 ? 1.2 : normalized &lt;= 1.5 ? 1.5 : normalized &lt;= 2 ? 2 : normalized &lt;= 3 ? 3 : normalized &lt;= 4 ? 4 : normalized &lt;= 5 ? 5 : normalized &lt;= 6 ? 6 : 8;
        return nice * magnitude;
      }

      function findParity(st, usAverage) {
        for (let pct = 0; pct &lt;= 80; pct += 1) {
          const rows = stacks.map((s) =&gt; calculate(s, st, pct / 100));
          if (weightedAverage(rows, &#x27;China&#x27;) &lt;= usAverage) return pct;
        }
        return null;
      }

      function updateSummary(rows, st) {
        const china = weightedAverage(rows, &#x27;China&#x27;);
        const us = weightedAverage(rows, &#x27;US&#x27;);
        const delta = ((china / us) - 1) * 100;
        els.gapLabel.textContent = `China vs US weighted ${metricMeta[st.metric].short}`;
        els.gapValue.textContent = `${formatValue(china, st.metric)} / ${formatValue(us, st.metric)}`;
        els.gapContext.textContent = `China is ${Math.abs(delta).toFixed(0)}% ${delta &lt;= 0 ? &#x27;lower&#x27; : &#x27;higher&#x27;} in this scenario`;

        if (st.metric === &#x27;allin&#x27; || st.metric === &#x27;cash&#x27;) {
          const parity = findParity(st, us);
          els.parityLabel.textContent = &#x27;China parity condition&#x27;;
          if (china &lt;= us) {
            els.parityValue.textContent = &#x27;Below US cost&#x27;;
            els.parityContext.textContent = `At a ${Math.round(st.modelAdvantage * 100)}% model compute advantage`;
          } else if (parity !== null) {
            els.parityValue.textContent = `≥ ${parity}%`;
            els.parityContext.textContent = &#x27;Model compute advantage needed, other inputs fixed&#x27;;
          } else {
            els.parityValue.textContent = &#x27;Not reached&#x27;;
            els.parityContext.textContent = &#x27;Even at the top of the modeled model-efficiency range&#x27;;
          }
        } else {
          const lowCostChinaCapacity = rows
            .filter((r) =&gt; r.country === &#x27;China&#x27; &amp;&amp; r.value &lt;= us)
            .reduce((sum, r) =&gt; sum + r.capacityValue, 0);
          const chinaCapacity = rows
            .filter((r) =&gt; r.country === &#x27;China&#x27;)
            .reduce((sum, r) =&gt; sum + r.capacityValue, 0);
          els.parityLabel.textContent = &#x27;China capacity below US average&#x27;;
          els.parityValue.textContent = `${Math.round(100 * lowCostChinaCapacity / chinaCapacity)}%`;
          els.parityContext.textContent = `Of modeled Chinese ${workloads[st.workload].label} capacity`;
        }
      }

      function draw(rows, st) {
        const svg = els.chart;
        while (svg.lastChild &amp;&amp; ![&#x27;title&#x27;, &#x27;desc&#x27;].includes(svg.lastChild.tagName)) svg.removeChild(svg.lastChild);

        const sorted = [...rows].sort((a, b) =&gt; a.value - b.value);
        const width = 736;
        const height = 390;
        const margin = { top: 30, right: 18, bottom: 82, left: 68 };
        const plotW = width - margin.left - margin.right;
        const plotH = height - margin.top - margin.bottom;
        const totalCapacity = sorted.reduce((sum, r) =&gt; sum + r.capacityValue, 0);
        const maxValue = niceMax(Math.max(...sorted.map((r) =&gt; r.value * 1.18)) * 1.08);
        const y = (v) =&gt; margin.top + plotH - (v / maxValue) * plotH;
        const x = (v) =&gt; margin.left + (v / totalCapacity) * plotW;

        for (let i = 0; i &lt;= 4; i += 1) {
          const value = maxValue * i / 4;
          const py = y(value);
          svg.appendChild(svgEl(&#x27;line&#x27;, { x1: margin.left, y1: py, x2: width - margin.right, y2: py, class: &#x27;ccc-gridline&#x27; }));
          svg.appendChild(svgEl(&#x27;text&#x27;, { x: margin.left - 10, y: py + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;ccc-tick&#x27; }, st.metric === &#x27;allin&#x27; || st.metric === &#x27;cash&#x27; ? `$${value.toFixed(value &lt; 1 ? 2 : 1)}` : value.toFixed(value &lt; 1 ? 2 : 1)));
        }

        svg.appendChild(svgEl(&#x27;line&#x27;, { x1: margin.left, y1: margin.top, x2: margin.left, y2: margin.top + plotH, class: &#x27;ccc-axis&#x27; }));
        svg.appendChild(svgEl(&#x27;line&#x27;, { x1: margin.left, y1: margin.top + plotH, x2: width - margin.right, y2: margin.top + plotH, class: &#x27;ccc-axis&#x27; }));

        const yLabel = svgEl(&#x27;text&#x27;, { x: 18, y: margin.top + plotH / 2, transform: `rotate(-90 18 ${margin.top + plotH / 2})`, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;ccc-axis-label&#x27; }, metricMeta[st.metric].axis);
        svg.appendChild(yLabel);
        svg.appendChild(svgEl(&#x27;text&#x27;, { x: margin.left + plotW / 2, y: height - 12, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;ccc-axis-label&#x27; }, &#x27;Annual useful-task capacity · million successful tasks&#x27;));

        let cumulative = 0;
        sorted.forEach((r) =&gt; {
          const x0 = x(cumulative);
          const x1 = x(cumulative + r.capacityValue);
          const barW = Math.max(2, x1 - x0 - 1);
          const barY = y(r.value);
          const barH = margin.top + plotH - barY;
          const center = x0 + barW / 2;
          const color = colors[r.country];

          const rect = svgEl(&#x27;rect&#x27;, { x: x0 + 0.5, y: barY, width: barW, height: barH, fill: color, &#x27;fill-opacity&#x27;: &#x27;0.72&#x27; });
          rect.appendChild(svgEl(&#x27;title&#x27;, {}, `${r.name}: ${formatValue(r.value, st.metric)}; ${r.capacityValue.toFixed(0)}M successful tasks/year`));
          svg.appendChild(rect);

          const lowY = y(Math.max(0, r.value * 0.82));
          const highY = y(r.value * 1.18);
          svg.appendChild(svgEl(&#x27;line&#x27;, { x1: center, y1: lowY, x2: center, y2: highY, class: &#x27;ccc-whisker&#x27; }));
          svg.appendChild(svgEl(&#x27;line&#x27;, { x1: center - 5, y1: lowY, x2: center + 5, y2: lowY, class: &#x27;ccc-whisker&#x27; }));
          svg.appendChild(svgEl(&#x27;line&#x27;, { x1: center - 5, y1: highY, x2: center + 5, y2: highY, class: &#x27;ccc-whisker&#x27; }));

          svg.appendChild(svgEl(&#x27;text&#x27;, { x: center, y: Math.max(margin.top + 12, highY - 7), &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;ccc-value-label&#x27; }, formatValue(r.value, st.metric)));
          const label = svgEl(&#x27;text&#x27;, { x: center, y: margin.top + plotH + 20, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;ccc-bar-label&#x27; });
          label.appendChild(svgEl(&#x27;tspan&#x27;, { x: center, dy: 0 }, r.short[0]));
          label.appendChild(svgEl(&#x27;tspan&#x27;, { x: center, dy: 15 }, r.short[1]));
          svg.appendChild(label);

          cumulative += r.capacityValue;
        });

        const lowest = sorted[0];
        els.lowest.textContent = `Lowest in this scenario: ${lowest.name} at ${formatValue(lowest.value, st.metric)}, representing ${lowest.capacityValue.toFixed(0)}M successful tasks/year.`;
        els.desc.textContent = `${workloads[st.workload].label} stacks ranked by ${metricMeta[st.metric].axis}. ${lowest.name} is lowest at ${formatValue(lowest.value, st.metric)}.`;
      }

      function update() {
        const st = state();
        els.powerOut.value = `${Math.round(st.powerDiscount * 100)}%`;
        els.hardwareOut.value = `${Math.round(st.hardwareGap * 100)}%`;
        els.modelOut.value = `${Math.round(st.modelAdvantage * 100)}%`;
        els.utilOut.value = `${Math.round(st.chinaUtil * 100)}%`;
        const rows = stacks.map((s) =&gt; calculate(s, st));
        updateSummary(rows, st);
        draw(rows, st);
      }

      [els.workload, els.metric, els.power, els.hardware, els.model, els.util].forEach((el) =&gt; {
        el.addEventListener(&#x27;input&#x27;, update);
        el.addEventListener(&#x27;change&#x27;, update);
      });

      update();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
